<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember &amp; Thyme — Kitchen Rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #241a12; }
  body { display: flex; align-items: center; justify-content: center; }
  #game { display: block; touch-action: none; image-rendering: auto; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Ember and Thyme Kitchen Rush: build burgers from the order board and serve them before patience runs out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
